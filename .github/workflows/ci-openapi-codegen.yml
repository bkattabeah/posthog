name: OpenAPI Codegen

on:
    push:
        branches:
            - master
    pull_request:
        paths:
            - '.github/workflows/ci-openapi-codegen.yml'
            - 'tools/openapi-codegen/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    test:
        name: OpenAPI codegen tests
        runs-on: posthog-hetzner-4
        timeout-minutes: 5
        steps:
            - name: Use baked Git reference repo
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  if [ -d /opt/git-reference/posthog.git/objects ]; then
                      echo "GIT_ALTERNATE_OBJECT_DIRECTORIES=/opt/git-reference/posthog.git/objects" >> "$GITHUB_ENV"
                  fi
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

            - name: Setup Node.js
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm --filter=@posthog/openapi-codegen install --frozen-lockfile

            - name: Run tests
              run: pnpm --filter=@posthog/openapi-codegen test
