name: shellcheck

on:
    pull_request:
    merge_group:

permissions:
    contents: read

jobs:
    shell_check:
        runs-on: posthog-hetzner-4
        timeout-minutes: 5
        name: shellcheck
        steps:
            - name: Use baked Git reference repo
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  if [ -d /opt/git-reference/posthog.git/objects ]; then
                      echo "GIT_ALTERNATE_OBJECT_DIRECTORIES=/opt/git-reference/posthog.git/objects" >> "$GITHUB_ENV"
                  fi
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - name: Install shellcheck
              run: sudo apt update && sudo apt install -y shellcheck
            - name: Check secrets scripts
              run: cd bin && shellcheck deploy-hobby
